<style>
:root{--bg:#090a12;--s1:#13152a;--s2:#1d2038;--line:rgba(255,255,255,.1);--glass:rgba(24,26,48,.6);--glass2:rgba(34,37,66,.72);--text:#efeefa;--mute:#a6a8c5;--accent:#ffb938;--onacc:#1d1400;--ok:#3fd8c4;--bad:#ff6b81;--warn:#ffb938;--ok-t:var(--ok);--bad-t:var(--bad);--warn-t:var(--warn);--panel:var(--s1);--link:color-mix(in srgb,var(--accent) 70%,var(--text));--r1:24px;--r2:16px;--hl:inset 0 1px 0 rgba(255,255,255,.07);--sh:0 18px 50px -18px rgba(0,0,0,.7);--b1:rgba(106,92,255,.26);--b2:rgba(25,211,181,.15);--b3:rgba(255,185,56,.11);color-scheme:dark}

@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--ok-t:#0a6b60;--bad-t:#b3122f;--warn-t:#7a4a00;--link:color-mix(in srgb,var(--accent) 40%,var(--text));--bg:#f1f0fa;--s1:#ffffff;--s2:#ebeaf7;--line:rgba(26,24,48,.11);--glass:rgba(255,255,255,.68);--glass2:rgba(255,255,255,.86);--text:#191730;--mute:#5d5b7c;--ok:#0e8f80;--bad:#d03352;--warn:#b36b00;--hl:inset 0 1px 0 rgba(255,255,255,.9);--sh:0 18px 40px -22px rgba(60,50,120,.35);--b1:rgba(106,92,255,.17);--b2:rgba(25,211,181,.13);--b3:rgba(255,185,56,.16);color-scheme:light}}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.sec{font-size:18px;margin:34px 0 12px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}

.nv:hover:not(:disabled){background:var(--s2);color:var(--text)}
.nv.on,.nv.on:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--text)}.nv.on .ic{color:var(--accent)}
.mob{display:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.ver{font-size:12px;color:var(--mute);padding:6px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-rail=min] .ver{display:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;flex:none}
html[data-rail=min] .nv span,html[data-rail=min] .brand .t,html[data-rail=min] .who .nm{display:none}
html[data-rail=min] .nv{justify-content:center;padding:10px}
html[data-rail=min] .brand{flex-direction:column;gap:8px;padding:2px 0 14px}
html[data-rail=min] .who{flex-direction:column}
html[data-rail=min] #rl .ic{transform:rotate(180deg)}
main{width:100%;max-width:1120px;margin:0 auto;padding:30px 32px 60px}
.ph{margin:0 0 22px}.ph:empty{display:none}
.ph h1{margin:0;font-size:28px;letter-spacing:-.035em}.ph p{margin:3px 0 0}
button,input,select,textarea{font:inherit;color:inherit;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
textarea{resize:vertical}

input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:560;transition:background .15s,border-color .15s}

button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:700}

button.danger{color:var(--bad-t)}

.ghost:hover:not(:disabled){background:var(--s2);color:var(--text)}
button.icon{padding:0;width:34px;height:34px;justify-content:center;border-radius:9px}
button.icon .ic{width:18px;height:18px}
.panel,.card{background:var(--s1);border:1px solid var(--line)}
.panel{border-radius:var(--r1);padding:18px}
.card{border-radius:var(--r2);padding:10px}.card h3{margin:9px 0 2px;font-size:15px;line-height:1.3}
.box{margin:0 -10px;padding:14px 10px;border-bottom:1px solid var(--line)}
.panel .box:last-child{border-bottom:0}
.box[data-q]:hover,.box.hov:hover{background:var(--s1);border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card[data-c],.card[data-v],.box[data-q],.pc{cursor:pointer}
.card[data-c]:hover,.card[data-v]:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.err{color:var(--bad-t);min-height:1.4em}
form{display:grid;gap:10px;margin-bottom:20px}
label.chk{display:inline-flex;gap:8px;align-items:center;margin-right:12px}label.chk input,.chk input{width:auto}
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.meter{margin-bottom:16px}.meter progress{margin-top:7px}
.srow{display:grid;grid-template-columns:12px 1fr auto 110px 200px auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.pc{flex:none;width:138px;text-align:left;padding:0;background:none;border:0;color:inherit;display:block}
.pc:hover:not(:disabled){background:none}.pc:hover .pw{outline:2px solid var(--accent)}
.pw{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:2/3;background:var(--s2);margin-bottom:8px}

.pc b{display:block;font-size:14px;line-height:1.3}
progress{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;border:0;border-radius:99px;background:var(--s2);overflow:hidden}
progress::-webkit-progress-bar{background:var(--s2);border-radius:99px}
progress::-webkit-progress-value{background:var(--accent);border-radius:99px;transition:width .5s}
progress::-moz-progress-bar{background:var(--accent);border-radius:99px}
progress.done::-webkit-progress-value{background:var(--ok)}progress.done::-moz-progress-bar{background:var(--ok)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.srow .dot{margin:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s2);font-size:12.5px;font-weight:560;color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok-t)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad-t)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--link)}
.pill a{color:inherit;margin-left:5px}
.chip{display:inline-block;padding:0 8px;border-radius:6px;background:var(--s2);color:var(--text);font-size:12.5px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--s2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 13px;color:var(--mute)}
.seg button:hover:not(:disabled){background:none;color:var(--text)}
.seg button.on,.seg button.on:hover:not(:disabled){background:var(--s1);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.28)}
.seg i{font-style:normal;margin-left:4px;color:var(--mute);font-weight:500}
.tr{display:flex;gap:12px;align-items:flex-start;box-shadow:inset 3px 0 0 transparent}
.tr[data-g=downloading]{box-shadow:inset 3px 0 0 var(--accent)}.tr[data-g=seeding]{box-shadow:inset 3px 0 0 var(--ok)}.tr[data-g=errors]{box-shadow:inset 3px 0 0 var(--bad)}
.tr>input{margin-top:5px;width:auto}
.tr .top{flex-wrap:nowrap;align-items:flex-start;gap:12px}
.tr .nm{flex:1;min-width:0;cursor:pointer;word-break:break-word;font-weight:620}
.tr .bar{display:flex;align-items:center;gap:10px;margin:9px 0 7px}.tr .bar progress{flex:1}.tr .bar span{font-size:12.5px;color:var(--mute);min-width:42px;text-align:right}
.tr .meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mute);font-size:13px}
.tr .acts{display:flex;gap:4px;flex:none}
.art .ud{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.art.rd .ud{background:transparent}.art.rd b{font-weight:500;color:var(--mute)}
.empty{text-align:center;padding:48px 12px;color:var(--mute)}.empty b{display:block;color:var(--text);font-size:16px;margin:10px 0 2px}
.empty .eic{width:46px;height:46px;border-radius:14px;background:var(--s2);display:inline-grid;place-items:center}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--s2),color-mix(in srgb,var(--s2) 70%,var(--text)),var(--s2));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
.sw.on{outline:2px solid var(--text);outline-offset:2px}
.login{max-width:380px;margin:12vh auto;padding:30px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r1)}
.ov{position:fixed;inset:0;background:rgba(6,7,16,.62);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.dlg{background:var(--s1);border:1px solid var(--line);border-radius:20px;max-width:780px;max-height:90vh;overflow:auto;padding:22px;display:flex;gap:18px;flex-wrap:wrap;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:0}}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:20;width:min(380px,calc(100vw - 36px))}
.toast{background:var(--s2);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:up .18s ease-out}
.toast.ok{border-left-color:var(--ok-t)}.toast.bad{border-left-color:var(--bad-t)}
.qs{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:9px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--mute);font-weight:500}
.qs span{flex:1;text-align:left}.qs kbd{font:inherit;font-size:12px;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
html[data-rail=min] .qs span,html[data-rail=min] .qs kbd{display:none}html[data-rail=min] .qs{justify-content:center}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;padding:0;border:0;background:none;flex:none}
.dot.warn{background:var(--warn)}
.pick{display:inline-flex;align-items:center;gap:8px;margin-top:10px}.pick select{padding:6px 10px}
.qi{padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer}.qi.on{background:var(--s2)}.qg{margin:12px 4px 4px;color:var(--mute);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal>div{background:var(--s1);min-height:96px;padding:6px;min-width:0}.cal .hd{min-height:0;text-align:center;color:var(--mute);font-size:12.5px;padding:8px}.cal .om{opacity:.45}
.cal .dn{font-size:12.5px;color:var(--mute)}.cal .td .dn{color:var(--link);font-weight:700}
.cal .ev{display:block;width:100%;text-align:left;padding:2px 6px;margin-top:3px;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);font-size:12px;line-height:1.35;border:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nc [data-pa],.nc [data-rs]{display:none!important}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fgrid label{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}.fgrid select,.fgrid input{width:100%}
.tgl{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tgl input[type=checkbox]{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--s2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s,border-color .15s;flex:none}
.tgl input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:left .15s,background .15s}
.tgl input[type=checkbox]:checked{background:color-mix(in srgb,var(--accent) 28%,transparent);border-color:var(--accent)}
.tgl input[type=checkbox]:checked::after{left:18px;background:var(--accent)}
.tgl input[type=checkbox]:disabled{opacity:.5;cursor:default}
.chev{display:inline-grid;transform:rotate(180deg);transition:transform .15s}.chev.o{transform:rotate(-90deg)}
.sel-bar{display:none;margin:10px 0;position:sticky;top:8px;z-index:3;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
@media(max-width:860px){.cal>div{min-height:62px;padding:3px}.cal .ev{font-size:10.5px;padding:1px 3px}}
@media(max-width:860px){
 .shell{display:block}
 .side{position:sticky;top:0;z-index:5;height:auto;padding:10px 10px 6px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:0 6px 8px}.brand #rl{display:none}.nav{flex-direction:row;overflow-x:auto;gap:4px;flex:none}
 .nv{width:auto;white-space:nowrap;padding:8px 12px}.nv.on,.nv.on:hover:not(:disabled){box-shadow:inset 0 -3px 0 var(--accent);border-radius:10px 10px 0 0}
 .who{display:none}.mob{display:flex}main{padding:20px 14px 48px}
 .hero{grid-template-columns:1fr}.ubw{display:none}.srow{grid-template-columns:12px 1fr auto auto}.srow .mute:nth-of-type(1){display:none}
 .ov{align-items:flex-end;padding:0}.dlg{width:100%!important;max-width:none;border-radius:20px 20px 0 0;max-height:92vh}

}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.card{position:relative}.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
.tick{position:absolute;top:14px;left:14px;width:22px;height:22px;z-index:2;accent-color:var(--accent)}
.bulk{position:sticky;bottom:12px;z-index:5;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.2);margin-top:14px}
.bulk .sep{flex:1}
.demo{background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;margin:0 0 14px;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}.bar>i.bad{background:var(--bad)}
.pill.warn{background:color-mix(in srgb,#e0a100 20%,transparent);color:var(--warn-t)}

.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:var(--onacc);padding:8px 14px;border-radius:8px;font-weight:600}.skip:focus{left:8px}
#m:focus{outline:none}

/* live dashboard, stats, charts */
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:13px 14px}.tile .tv{font-size:24px}.npg{grid-template-columns:1fr}}
:root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500}
:root[data-theme=light]{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:8px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r1);padding:16px 18px;min-width:0;transition:border-color .15s,transform .15s}
.tile[data-go]{cursor:pointer}.tile[data-go]:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .tl{color:var(--mute);font-size:13px;font-weight:560;margin-bottom:4px}
.tile .tv{display:block;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.tile .spark{margin:8px -4px 0;height:54px}.tile .meter{margin-bottom:12px}
progress.hot::-webkit-progress-value{background:var(--bad)}progress.hot::-moz-progress-bar{background:var(--bad)}
.live{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;background:var(--s2);color:var(--mute);font-size:13px;font-weight:600;margin:4px 10px 0 0}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live.on{color:var(--ok-t)}.live.on i{background:var(--ok);animation:pulse 2s ease-out infinite}
.live.off{color:var(--warn-t)}.live.off i{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.live.on i{animation:none}.tile,.tile[data-go]:hover{transition:none;transform:none}}
.npg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.np{display:flex;gap:14px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:var(--r1);padding:14px}
.npi{flex:none;width:76px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--s2)}.npi img{width:100%;height:100%;object-fit:cover;display:block}
.npb{flex:1;min-width:0}.npb b{word-break:break-word}
.ubw{display:inline-flex;align-items:center;min-width:0}.ub{display:block;max-width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}

async function showStage(){

  let files=[];try{files=await (await fetch('/api/wallpapers')).json()}catch{}

// Sign in with Plex: Plex's own window does the signing in (password, two-step, Google or Apple), we just wait for it to finish.
let PX=null;
async function plexSignIn(){
  const b=$('#px'),st=$('#pxs'),err=$('#e');if(!b)return;
  if(PX){PX.stop();return}
  err.textContent='';st.textContent='';
  let stop=false,win=window.open('about:blank','mh_plex','width=620,height=780');   // opened right away, or the browser blocks it
  const done=()=>{PX=null;b.textContent='Sign in with Plex';b.disabled=false;if(win&&!win.closed)try{win.close()}catch{}};
  PX={stop:()=>{stop=true;st.textContent='';done()}};b.textContent='Waiting for Plex (click to cancel)';
  try{
    const s=await api('/api/plexlogin/start','POST');
    if(win&&!win.closed)win.location.href=s.url;
    else st.innerHTML=`Your browser blocked the Plex window. <a href="${esc(s.url)}" target="_blank" rel="noopener">Open Plex sign-in</a>, then come back here.`;
    if(win&&!win.closed)st.textContent='Finish signing in in the Plex window.';
    const t0=Date.now();
    while(!stop&&Date.now()-t0<570000){
      await new Promise(r=>setTimeout(r,1500));if(stop)return;
      const r=await api('/api/plexlogin/poll?t='+encodeURIComponent(s.ticket));
      if(r&&r.user){done();return start()}
    }
    if(!stop){done();err.textContent='That took too long. Please try again.'}
  }catch(x){if(!stop){done();st.textContent='';err.textContent=x.message}}
}

  if(!secs.some(s=>s[0]===stSub))stSub='acct';
  const cur=secs.find(s=>s[0]===stSub);
  const groups=[...new Set(secs.map(s=>s[5]))];
  const nav=`<nav class="sxn" id="sn" aria-label="Settings sections">${groups.map(g=>`<div class="sxg"><div class="sxh">${g}</div>${secs.filter(s=>s[5]===g).map(([k,n,,d,i])=>`<button data-k="${k}" class="${k===stSub?'on':''}"${k===stSub?' aria-current="page"':''}>${ic(i)}<span><b>${n}</b><small>${d}</small></span></button>`).join('')}</div>`).join('')}</nav>`;
  const mm=$('#m');mm.insertAdjacentHTML('beforebegin',nav);
  mm.closest('main').classList.add('sx');
  mm.insertAdjacentHTML('beforebegin',`<div class="sxt"><h2>${cur[1]}</h2><p class="mute">${cur[3]}</p></div>`);
  $('#sn').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;stSub=b.dataset.k;render()};
  const ob=$('#sn .on');if(ob&&ob.scrollIntoView)ob.scrollIntoView({inline:'center',block:'nearest'});
  ({acct:stAcct,look:stLook,apps:svcView,lists:stLists,users:usrView,alerts:alView,links:linksView,rules:stRules,backup:stBackup,audit:stAudit,about:stAbout})[stSub]();
}

function appDialog(existing,done){
  const e0=existing||{type:'sonarr'};
  const o=modal(`<h2 style="margin-top:0">${existing?'Edit app':'Add an app'}</h2><form id="af3">
    ${existing?`<input type="hidden" name="type" value="${e0.type}"><div class="mute">${TYPES[e0.type]}</div>`:`<select name="type" aria-label="App">${Object.entries(TYPES).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select>`}
    <input name="name" placeholder="Name shown in GoatMediaStackarr" value="${esc(e0.name||'')}" required><input name="url" placeholder="Address, for example http://192.168.1.10:8989" value="${esc(e0.url||'')}" required>
    <div id="fk" style="display:grid;gap:10px"></div><div class="mute" id="fh"></div>
    <div class="row"><button type="button" id="tb2">Test connection</button><span id="tr" class="pill" hidden></span></div><div class="err" id="ae2"></div>
    <div class="row"><button class="primary">${existing?'Save changes':'Add app'}</button><button type="button" data-x>Cancel</button></div></form>`);
  const f=o.querySelector('#af3').elements;
  const sync=()=>{const t=f.type.value,a=APPS[t]||{};
    o.querySelector('#fk').innerHTML=a.user?`<input name="user" placeholder="Username" value="${esc(e0.user||'')}" autocomplete="off"><input name="pass" type="password" placeholder="${existing?'Password (leave empty to keep)':'Password'}" autocomplete="new-password">`
      :`<input name="apiKey" type="password" placeholder="${existing?'API key or token (leave empty to keep)':'API key or token'}" autocomplete="off">${a.admin?`<input name="pass" type="password" placeholder="${existing?'Admin password (optional, leave empty to keep)':'Admin password (optional)'}" autocomplete="new-password">`:''}`;
    o.querySelector('#fh').textContent=a.key||'';
    if(!existing){f.url.placeholder='Address, for example http://192.168.1.10:'+(a.port||80);if(!f.name.value||f.name.value===f.name.dataset.t){f.name.value=TYPES[t];f.name.dataset.t=TYPES[t]}}};
  const body=()=>({type:f.type.value,name:f.name.value.trim(),url:f.url.value.trim(),apiKey:f.apiKey?f.apiKey.value:'',user:f.user?f.user.value:'',pass:f.pass?f.pass.value:''});
  if(!existing)f.type.onchange=sync;sync();
  o.querySelector('[data-x]').onclick=o.close;
  o.querySelector('#tb2').onclick=async()=>{const t=o.querySelector('#tr'),b=o.querySelector('#tb2');b.disabled=true;t.hidden=false;t.className='pill';t.textContent='Testing…';o.querySelector('#ae2').textContent='';
    try{const r=await api('/api/services/test','POST',{id:existing&&existing.id,...body()});t.className='pill '+(r.ok?'ok':'bad');t.textContent=r.message}catch(x){t.className='pill bad';t.textContent=x.message}b.disabled=false};
  o.querySelector('#af3').onsubmit=async e=>{e.preventDefault();const bd=body();
    try{if(existing){delete bd.type;await api('/api/services/'+existing.id,'PUT',bd)}else await api('/api/services','POST',bd);
      await load();o.close();toast(existing?'Saved':'App added','ok');done()}catch(x){o.querySelector('#ae2').textContent=x.message}};
}
function svcView(){

  const draw=()=>{$('#al3').innerHTML=services.map(s=>`<div class="srow" style="grid-template-columns:40px 1fr auto auto">${svcIcon(s.type,s.id)}<div style="min-width:0"><b>${esc(s.name)}</b> <span class="mute">${esc(TYPES[s.type]||s.type)}</span><div class="mute" style="word-break:break-all">${esc(s.url)}</div></div>
      <span class="mute" id="t${s.id}">Checking</span><span class="row"><button data-e="${s.id}">Edit</button><button class="danger" data-x="${s.id}">Remove</button></span></div>`).join('')||empty('No apps yet','Add Sonarr, Radarr, qBittorrent or any other app to get started.');
    services.forEach(async s=>{let ok=false;try{ok=(await api('/api/status/'+s.id)).ok}catch{}const d=$('#d'+s.id);if(!d)return;d.className='dot '+(ok?'ok':'bad');$('#t'+s.id).textContent=ok?'Online':'Not reachable'})};
  draw();
  $('#aa').onclick=()=>appDialog(null,render);
  $('#al3').onclick=async e=>{const ed=e.target.closest('[data-e]'),rm=e.target.closest('[data-x]');
    if(ed)appDialog(services.find(s=>s.id===ed.dataset.e),render);
    if(rm&&confirm('Remove this app from GoatMediaStackarr? The app itself is not touched.')){try{await api('/api/services/'+rm.dataset.x,'DELETE');await load();toast('Removed','ok');render()}catch(x){toast(x.message,'bad')}}};
}

function stBackup(){

    <div class="panel" style="max-width:560px;margin-top:16px" id="ab"></div>
    <div class="panel" style="max-width:560px;margin-top:16px"><h3 style="margin-top:0">Restore</h3><p class="mute">Replaces everything in GoatMediaStackarr with what is in the backup, and signs everyone out. Use it to move to a new server or recover.</p>
    <form id="rf2" style="margin:0"><input type="file" name="file" accept=".json,application/json" required><input name="pass" type="password" placeholder="Passphrase of that backup" autocomplete="off" required><div class="row"><button class="danger">Restore from backup</button></div><div class="err" id="re2"></div></form></div>`;

      a.download='mediahub-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();toast('Backup downloaded','ok');e.target.reset()}catch(x){$('#be').textContent=x.message}};
  $('#rf2').onsubmit=async e=>{e.preventDefault();$('#re2').textContent='';

async function autoBackups(){
  const box=$('#ab');if(!box)return;
  let d;try{d=await api('/api/backups')}catch(x){box.innerHTML=`<div class="err">${esc(x.message)}</div>`;return}
  if(!$('#ab'))return;
  const fs_=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  box.innerHTML=`<h3 style="margin-top:0">Automatic backups</h3><p class="mute">Saves a copy inside the GoatMediaStackarr data folder every day. These copies are not passphrase-locked, so they stay as private as the data folder itself. Download a locked backup above if you want to store one elsewhere.</p>
    <form id="abf" style="margin:0"><label class="chk" style="display:flex"><input type="checkbox" name="on" ${d.cfg.on?'checked':''}>Make a backup every day</label>
    <div class="row"><label class="mute">At <select name="hour">${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===d.cfg.hour?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></label>
    <label class="mute">Keep the last <input name="keep" type="number" min="1" max="60" value="${d.cfg.keep}" style="width:70px"></label></div>
    <div class="row"><button class="primary">Save</button><button type="button" id="abr">Back up now</button></div></form>
    <div id="abl" style="margin-top:10px">${d.files.map(f=>`<div class="srow" style="grid-template-columns:1fr auto" data-n="${esc(f.name)}"><div><b>${esc(f.name)}</b> <span class="mute">${fs_(f.size)}, ${esc(fdt(f.at))}</span></div><span class="row"><button data-rs>Restore</button><button class="danger" data-dl>Delete</button></span></div>`).join('')||'<p class="mute">No copies yet.</p>'}</div>`;
  $('#abf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements;try{await api('/api/backups/config','PUT',{on:f.on.checked,hour:f.hour.value,keep:f.keep.value});toast('Saved','ok');autoBackups()}catch(x){toast(x.message,'bad')}};
  $('#abr').onclick=async()=>{try{await api('/api/backups/run','POST');toast('Backup made','ok');autoBackups()}catch(x){toast(x.message,'bad')}};
  $('#abl').onclick=async e=>{const row=e.target.closest('[data-n]');if(!row)return;const n=row.dataset.n;
    if(e.target.closest('[data-dl]')&&confirm('Delete this copy?')){try{await api('/api/backups/'+encodeURIComponent(n),'DELETE');autoBackups()}catch(x){toast(x.message,'bad')}}
    if(e.target.closest('[data-rs]')&&confirm('Replace everything in GoatMediaStackarr with this copy? Everyone will be signed out.')){try{await api('/api/backups/restore','POST',{name:n});toast('Restored. Please sign in again.','ok');me=null;setTimeout(start,600)}catch(x){toast(x.message,'bad')}}};
}

        $('#r').innerHTML=`<div class="row" style="margin:12px 0"><label class="mute">Quality <select id="mp">${d.profiles.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
          ${d.meta.length?`<label class="mute">Profile <select id="mm">${d.meta.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`:''}<label class="mute">Folder <select id="mf2">${d.folders.map(f=>`<option>${esc(f.path)}</option>`).join('')}</select></label></div>
          <div class="grid">${d.results.map((x,i)=>card(x,i,`<div class="mute">${esc((x.overview||'').slice(0,100))}</div><p>${x.added?'<span class="mute">Already in your library</span>':`<button data-a="${i}">Add</button>`}</p>`)).join('')||'<p class="mute">Nothing found.</p>'}</div>`;
        $('#r').onclick=async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;b.disabled=true;b.textContent='Adding…';
          try{await api(`/api/media/${s.id}/add`,'POST',{item:d.results[b.dataset.a].raw,rootFolderPath:$('#mf2').value,qualityProfileId:+$('#mp').value,metadataProfileId:$('#mm')?+$('#mm').value:1});b.replaceWith(Object.assign(document.createElement('span'),{className:'pill ok',textContent:'Added'}))}
          catch(x){b.disabled=false;b.textContent='Add';$('#e').textContent=x.message}}}
      catch(x){$('#r').innerHTML='';$('#e').textContent=x.message}};
    return;
  }
  $('#mb').innerHTML=`<div class="row" style="margin-bottom:10px"><input id="mq" type="search" placeholder="Filter your ${music?'artists':'authors'}" aria-label="Filter" value="${esc(mbQ)}" style="flex:1;min-width:150px"><span class="mute" id="mc"></span></div><div class="err" id="e"></div><div id="g">${skel(6)}</div>`;
  let d;try{d=await api(`/api/media/${s.id}/library`)}catch(x){$('#g').innerHTML='';$('#e').textContent=x.message;return}
  if(tab!=='mb')return;
  const paint=()=>{const q=mbQ.trim().toLowerCase(),l=d.items.filter(x=>!q||x.title.toLowerCase().includes(q)||x.genres.some(g=>g.toLowerCase().includes(q))).sort((a,b)=>sortTitle(a.title).localeCompare(sortTitle(b.title)));
    $('#mc').textContent=`${l.length} ${l.length===1?one:one+'s'}${d.missing?`, ${d.missing} missing ${music?'albums':'books'}`:''}`;
    $('#g').innerHTML=l.length?`<div class="grid">${l.map(x=>card(x,d.items.indexOf(x),`<div class="mute">${x.total?`${x.have}/${x.total} ${music?'tracks':'books'}`:`${x.count} ${music?'albums':'books'}`}${x.monitored?'':', not monitored'}</div>`)).join('')}</div>`:empty('Nothing here yet',canAdd?'Use "Find and add" to bring in some '+(music?'music':'books')+'.':'Nothing matches.')};
  $('#mq').oninput=e=>{mbQ=e.target.value;paint()};
  $('#g').onclick=e=>{const c=e.target.closest('[data-i]');if(!c)return;const x=d.items[+c.dataset.i];
    const o=modal(`<div class="row"><h2 style="margin:0;flex:1">${esc(x.title)}</h2><button data-x>Close</button></div><div class="row" style="align-items:flex-start;gap:16px;margin-top:12px">${x.poster?`<img src="${esc(x.poster)}" alt="" style="width:140px;border-radius:10px">`:''}
      <div class="grow" style="min-width:220px"><div class="mute">${esc(x.genres.join(', '))}${x.size?' · '+fmt(x.size):''}</div><p>${esc(x.overview||'No description available.')}</p>
      <div class="row"><label class="tgl"><input type="checkbox" data-mon ${x.monitored?'checked':''} ${canAdd?'':'disabled'}><span>Monitored</span></label>${canAdd?'<button data-f>Search for missing</button>':''}${admin?'<button class="danger" data-rm>Remove</button>':''}</div></div></div>`);
    o.querySelector('[data-x]').onclick=o.close;
    o.querySelector('[data-mon]').onchange=async ev=>{const v=ev.target.checked;try{await api(`/api/media/${s.id}/monitor`,'POST',{id:x.id,monitored:v});x.monitored=v;paint();toast(v?'Monitored':'Not monitored','ok')}catch(er){ev.target.checked=!v;toast(er.message,'bad')}};
    const f=o.querySelector('[data-f]');if(f)f.onclick=async()=>{f.disabled=true;try{await api(`/api/media/${s.id}/find`,'POST',{id:x.id});toast('Searching','ok')}catch(er){toast(er.message,'bad')}f.disabled=false};
    const rm=o.querySelector('[data-rm]');if(rm)rm.onclick=async()=>{if(!confirm('Remove "'+x.title+'" from '+s.name+'?'))return;const files=confirm('Also delete the files from disk?\n\nOK = delete the files, Cancel = keep the files');
      try{await api(`/api/media/${s.id}/${x.id}?files=${files?1:0}`,'DELETE');o.close();mbView()}catch(er){toast(er.message,'bad')}}};
  paint();
}

// ---------- Subtitles (Bazarr)
async function subView(){
  const s=first('bazarr');if(!s)return noSvc('Bazarr');
  const canCtl=can('control');$('#m').innerHTML=skel(4);
  const load=async()=>{let d;try{d=await api(`/api/bazarr/${s.id}/wanted`)}catch(x){if(tab==='sub')$('#m').innerHTML=`<div class="err">${esc(x.message)}</div>`;return}
    if(tab!=='sub')return;
    const rows=[...d.episodes.map(x=>({k:'episode',id:x.id,seriesId:x.seriesId,t:x.title,sub:`${x.ep} ${x.name||''}`,miss:x.missing})),...d.movies.map(x=>({k:'movie',id:x.id,t:x.title,sub:'Movie',miss:x.missing}))];
    $('#m').innerHTML=`<div class="row" style="margin-bottom:10px"><span class="mute grow" id="sc">${d.total} ${d.total===1?'item is':'items are'} missing subtitles${rows.length<d.total?` (showing the first ${rows.length})`:''}</span>${canCtl&&rows.length?'<button id="sa">Search all shown</button>':''}</div>`
      +(rows.map((x,i)=>`<div class="box row" data-r="${i}"><div class="grow" style="min-width:0"><b>${esc(x.t)}</b> <span class="mute">${esc(x.sub)}</span><div style="margin-top:4px">${x.miss.map(l=>`<span class="pill">${esc(l.name||l.code)}${l.forced?' (forced)':''}${l.hi?' (HI)':''}</span>`).join(' ')}</div></div>${canCtl?`<button data-s="${i}">Search</button>`:''}</div>`).join('')||empty('Nothing missing','Every monitored item already has the subtitles you asked for.'));
    const one=async(x,b)=>{try{const r=await api(`/api/bazarr/${s.id}/search`,'POST',{kind:x.k,id:x.id,seriesId:x.seriesId,langs:x.miss.map(l=>({code:l.code,forced:l.forced,hi:l.hi}))});return r}catch(e){return{error:e.message}}};
    $('#m').onclick=async e=>{const b=e.target.closest('[data-s]');
      if(b){const x=rows[+b.dataset.s];b.disabled=true;b.textContent='Searching…';const r=await one(x);
        if(r.error){toast(x.t+': '+r.error,'bad');b.disabled=false;b.textContent='Search'}else{toast(`Found ${r.found} of ${r.of}`,'ok');load()}}
      if(e.target.closest('#sa')){const a=e.target.closest('#sa');a.disabled=true;let ok=0;
        for(let i=0;i<rows.length;i++){if(tab!=='sub')return;a.textContent=`Searching ${i+1} of ${rows.length}…`;const r=await one(rows[i]);if(!r.error)ok++}
        toast(`Subtitles found for ${ok} of ${rows.length}`,ok?'ok':'bad');load()}}};
  load();
}

// ---------- Usenet (SABnzbd)
async function nzbView(){
  const s=first('sabnzbd');if(!s)return noSvc('SABnzbd');
  const canCtl=can('control'),canAdd=can('add');
  $('#m').innerHTML=`<div id="nq"></div>${canAdd?`<h2 class="sec">Add a download</h2><form id="na" class="panel" style="max-width:640px"><label class="mute">NZB file <input type="file" name="file" accept=".nzb,.gz,application/x-nzb"></label>
      <input name="url" placeholder="or paste an address to an NZB" aria-label="NZB address"><input name="cat" placeholder="Category (optional)" aria-label="Category"><div class="row"><button class="primary">Add to SABnzbd</button></div><div class="err" id="ne"></div></form>`:''}
    <h2 class="sec">History</h2><div id="nh">${skel(3)}</div>`;
  const q=async()=>{try{const d=await api(`/api/sab/${s.id}/queue`),el=$('#nq');if(!el||tab!=='nzb')return;
    el.innerHTML=`<div class="panel"><div class="row" style="gap:28px"><div><div class="mute">Speed</div><b style="font-size:24px;color:var(--link)">${fmt(d.speed)}/s</b></div><div><div class="mute">In queue</div><b style="font-size:22px">${d.slots}</b></div><span class="mute">${esc(d.timeleft||'')}${d.paused?' (paused)':''}</span><span class="grow"></span>${canCtl?`<button data-sp="${d.paused?'resume':'pause'}">${ic(d.paused?'play':'pause')}${d.paused?'Resume':'Pause'}</button>`:''}</div>
      ${d.jobs.map(j=>`<div class="box"><b>${esc(j.name)}</b><div class="mute">${esc(j.size)}${j.left?', '+esc(j.left):''}</div><progress value="${j.pct}" max="100" style="margin-top:6px" aria-label="Progress"></progress></div>`).join('')}</div>`;
    const b=el.querySelector('[data-sp]');if(b)b.onclick=async()=>{try{await api(`/api/sab/${s.id}/act`,'POST',{op:b.dataset.sp});q()}catch(x){toast(x.message,'bad')}}}catch(x){if($('#nq'))$('#nq').innerHTML=`<div class="err">${esc(x.message)}</div>`}};
  const h=async()=>{try{const l=await api(`/api/sab/${s.id}/history`);if(!$('#nh')||tab!=='nzb')return;
    $('#nh').innerHTML=l.map(x=>`<div class="box row" data-h="${esc(x.id)}"><div class="grow" style="min-width:0"><b style="word-break:break-word">${esc(x.name)}</b><div class="mute">${esc(x.size)}${x.cat?' · '+esc(x.cat):''}${x.at?' · '+ago(x.at):''}</div>${x.error?`<div class="err" style="min-height:0">${esc(x.error)}</div>`:''}</div>
      <span class="pill ${x.status==='Completed'?'ok':x.status==='Failed'?'bad':''}">${esc(x.status)}</span>${canCtl?`${x.status==='Failed'?'<button data-o="retry">Retry</button>':''}<button class="icon danger" data-o="delete" aria-label="Remove from history" title="Remove from history">${ic('trash')}</button>`:''}</div>`).join('')||'<p class="mute">Nothing in the history yet.</p>'}catch(x){if($('#nh'))$('#nh').innerHTML=`<div class="err">${esc(x.message)}</div>`}};
  $('#m').onclick=async e=>{const b=e.target.closest('[data-o]');if(!b)return;const id=b.closest('[data-h]').dataset.h;b.disabled=true;
    try{await api(`/api/sab/${s.id}/history/act`,'POST',{id,op:b.dataset.o});toast(b.dataset.o==='retry'?'Retrying':'Removed','ok');h();q()}catch(x){toast(x.message,'bad');b.disabled=false}};
  if($('#na'))$('#na').onsubmit=async e=>{e.preventDefault();const f=e.target,file=f.file.files[0],url=f.url.value.trim();$('#ne').textContent='';
    if(!file&&!url){$('#ne').textContent='Choose an NZB file or paste an address';return}
    try{let body={category:f.cat.value.trim()};
      if(file){if(file.size>8e6)throw new Error('That file is too large');const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(new Error('Could not read the file'));r.readAsDataURL(file)});body={...body,name:file.name,nzb:b64}}
      else body.url=url;
      await api(`/api/sab/${s.id}/add`,'POST',body);f.reset();toast('Added to SABnzbd','ok');q()}catch(x){$('#ne').textContent=x.message}};
  q();h();timer=[tick(q,5000),tick(h,30000)];
}

// ---------- Health (admin)
async function hlView(){
  $('#m').innerHTML=skel(4);
  let l;try{l=await api('/api/libhealth')}catch(x){$('#m').innerHTML=`<div class="err">${esc(x.message)}</div>`;return}
  if(tab!=='hl')return;
  const total=l.reduce((a,x)=>a+x.issues.length+x.queue.length+(x.ok?0:1),0);
  $('#m').innerHTML=`<p class="mute">${total?`${total} thing${total===1?'':'s'} to look at.`:'Everything looks healthy.'}</p>`+l.map(x=>{
    const n=x.issues.length+x.queue.length+(x.ok?0:1);
    return `<div class="panel" style="margin-bottom:14px"><div class="row"><b style="font-size:16px">${esc(x.name)}</b><span class="mute">${esc(TYPES[x.type]||x.type)}</span><span class="grow"></span>${x.missing!=null?`<span class="mute">${x.missing} missing</span>`:''}<span class="pill ${!x.ok?'bad':n?'warn':'ok'}">${!x.ok?'Not reachable':n?n+' to check':'Healthy'}</span></div>
      ${!x.ok?`<div class="err">${esc(x.error||'')}</div>`:''}
      ${x.issues.map(i=>`<div class="box row" style="margin-top:8px"><span class="pill ${i.level==='bad'?'bad':'warn'}">${i.level==='bad'?'Error':'Warning'}</span><span class="grow" style="word-break:break-word">${esc(i.text)}</span></div>`).join('')}
      ${x.queue.length?`<div class="mute" style="margin-top:12px">Downloads that are stuck</div>${x.queue.map(i=>`<div class="box"><b style="word-break:break-word">${esc(i.title)}</b><div class="mute">${esc(i.message)}</div></div>`).join('')}`:''}
      ${x.disks.length?`<div class="mute" style="margin-top:12px">Disk space</div>${x.disks.map(d=>{const used=(1-d.free/d.total)*100;return `<div style="margin:8px 0"><div class="row"><span class="grow">${esc(d.path)}</span><span class="mute">${fmt(d.free)} free of ${fmt(d.total)}</span></div><div class="bar" role="img" aria-label="${used.toFixed(0)} percent used"><i class="${used>90?'bad':''}" style="width:${used.toFixed(0)}%"></i></div></div>`}).join('')}`:''}</div>`}).join('');
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
start();
</script></body></html>
