plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace 'com.bdlnaredi.goatstack'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bdlnaredi.goatstack'
        minSdk 26
        targetSdk 34
        // The release workflow passes the version tag (v0.3.1 → 0.3.1) and a growing build number.
        versionCode Integer.parseInt((project.findProperty('appCode') ?: '1').toString())
        versionName((project.findProperty('appVersion') ?: '1.0.0').toString())
    }

    // A fixed key, so a newer goatmediastackarr.apk installs over an older one. It is in the repository on
    // purpose: this is for installing your own copy (sideloading), not for the Play Store.
    signingConfigs {
        release {
            storeFile file('goatstack.keystore')
            storePassword 'goatstack'
            keyAlias 'goatstack'
            keyPassword 'goatstack'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
        ]
    }

    // Screen tests run on the computer (Robolectric), photographed with Roborazzi.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { it.maxHeapSize = '2g' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/versions/9/previous-compilation-data.bin'] }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.26.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.26.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
