name: Sign-in page
# Publishes site/ on GitHub Pages (https://bdlnaredi.github.io/goatmediastackarr/). Its signin/ page is where Google
# sends people after "Connect Google Drive": it passes them on to their own GoatMediaStackarr.
# Needs Settings → Pages → Source: GitHub Actions (once).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
