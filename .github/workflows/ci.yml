name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:   # the weekly rebuild runs these same checks before publishing
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools shellcheck
      - run: npm run check
      - name: Tests
        # Each test file gets a time limit; a failure or a hang is reported with the file name and its output.
        run: |
          fail=0
          for f in test/*.test.js ui/test/*.test.js; do
            if ! timeout 180 node --test --test-timeout=120000 "$f" > /tmp/t.out 2>&1; then
              fail=1
              msg=$(grep -vE '^\s*(at |#)' /tmp/t.out | tail -c 3500 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f failed or hung::$msg"
            fi
          done
          exit $fail
      - name: Shell scripts
        run: shellcheck -S error -s bash goat/*.sh test/*.sh
      - name: VPN kill switch (real network namespaces)
        run: sudo bash test/vpn-killswitch.sh
      - name: VPN kill switch with a real WireGuard tunnel
        run: |
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          sudo GITHUB_ACTIONS=1 bash test/vpn-wireguard.sh

  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The image is ~2.8 GB and Jellyfin will not start with less than 2 GB free, so remove the runner's
        # preinstalled SDKs first.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1 | awk '{print "::notice::Free disk space before building: " $4}'
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! docker buildx build --load --progress=plain -t goat:ci --build-arg VERSION=ci \
                 --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN . 2>&1 | tee build.log; then
            # Turn the important lines into annotations so the reason shows on the run's page.
            grep -E 'fetch-release|ERROR|E: |error:|Error:|No matching|not found' build.log | tail -10 | sed 's/^/::error::/'
            exit 1
          fi
          grep -E '^#[0-9]+ [0-9.]+ fetch-release: [A-Za-z0-9_-]+/[A-Za-z0-9_-]+ ' build.log | sed 's/^/::notice::/' || true
          docker buildx prune -af >/dev/null 2>&1 || true
          df -h / | tail -1 | awk '{print "::notice::Free disk space after building: " $4}'
      - name: Image size
        run: echo "::notice::Image size (${{ matrix.arch }}) $(docker image inspect goat:ci --format '{{.Size}}' | numfmt --to=iec)"
      - name: Start it
        run: |
          mkdir -p /tmp/goat/config /tmp/goat/media /tmp/goat/downloads
          docker run -d --name goat -p 2806:2806 -p 8096:8096 \
            -e PUID=1001 -e PGID=121 -e TZ=Asia/Kolkata \
            -e GOAT_ENGINES=sonarr,radarr,lidarr,prowlarr,bazarr,qbittorrent,rutorrent,deluge,sabnzbd,jellyfin,seerr,tautulli \
            -v /tmp/goat/config:/config -v /tmp/goat/media:/media -v /tmp/goat/downloads:/downloads \
            --cap-add=NET_ADMIN --device=/dev/net/tun \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 --sysctl net.ipv4.conf.all.rp_filter=2 \
            goat:ci
      - name: Every engine answers
        run: |
          check() { docker exec goat sh -c "curl -fsS -o /dev/null --max-time 5 $2"; }
          declare -A urls=(
            [sonarr]=http://127.0.0.1:8989/engines/sonarr/ping
            [radarr]=http://127.0.0.1:7878/engines/radarr/ping
            [lidarr]=http://127.0.0.1:8686/engines/lidarr/ping
            [prowlarr]=http://127.0.0.1:9696/engines/prowlarr/ping
            [bazarr]=http://127.0.0.1:6767/engines/bazarr/
            [qbittorrent]=http://127.0.0.1:8080/api/v2/app/version
            [sabnzbd]=http://127.0.0.1:8085/engines/sabnzbd/
            [jellyfin]=http://127.0.0.1:8096/health
            [seerr]=http://127.0.0.1:5055/api/v1/status
            [tautulli]=http://127.0.0.1:8181/engines/tautulli/
            [rutorrent]='-u goat:$(jq -r .rutorrentPass /config/goat/secrets.json) http://127.0.0.1:8090/'
            [deluge]=http://127.0.0.1:8112/
            [ui]=http://127.0.0.1:2806/api/health )
          for i in $(seq 1 90); do
            missing=""
            for k in "${!urls[@]}"; do check "$k" "${urls[$k]}" || missing="$missing $k"; done
            [ -z "$missing" ] && { echo "All engines answer."; exit 0; }
            echo "waiting for:$missing"; sleep 10
          done
          echo "::error title=Not answering after 15 minutes::$missing"
          docker logs goat 2>&1 | tail -60 | sed 's/^/::error::/'; exit 1
      - name: Engines are connected to each other
        run: |
          for i in $(seq 1 60); do
            if docker exec goat test -f /config/goat/wired.json; then
              docker exec goat cat /config/goat/wired.json | jq -c '.steps | to_entries[] | {(.key): .value.ok}'
              if docker exec goat jq -e '[.steps[] | .ok] | length >= 6 and all' /config/goat/wired.json >/dev/null; then exit 0; fi
            fi
            sleep 10
          done
          docker exec goat jq -r '.steps | to_entries[] | select(.value.ok | not) | "::error::\(.key): \(.value.error)"' /config/goat/wired.json || true
          docker logs goat 2>&1 | grep -E 'goat-wire.*FAILED' | tail -5 | cut -c1-900 | sed 's/^/::error::/'
          exit 1
      - name: ruTorrent and Deluge work for real
        run: |
          # ruTorrent asks for its login; the trusted /RPC2 answers only inside the container.
          code=$(docker exec goat curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/)
          [ "$code" = 401 ] || { echo "::error::ruTorrent page did not ask for a login ($code)"; exit 1; }
          code=$(docker exec goat curl -s -o /dev/null -w '%{http_code}' -u "goat:$(docker exec goat jq -r .rutorrentPass /config/goat/secrets.json)" http://127.0.0.1:8090/conf/config.php)
          [ "$code" = 403 ] || { echo "::error::ruTorrent's settings folder was not private ($code)"; exit 1; }
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' goat)
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "goat:$(docker exec goat jq -r .rutorrentPass /config/goat/secrets.json)" -d x "http://$ip:8090/RPC2")
          [ "$code" = 403 ] || { echo "::error::/RPC2 answered from outside the container ($code)"; exit 1; }
          # Deluge's Web UI takes the password made for you and is connected to its daemon.
          pw=$(docker exec goat jq -r .delugePass /config/goat/secrets.json)
          docker exec goat curl -fsS -c /tmp/dck -H 'Content-Type: application/json' -d "{\"method\":\"auth.login\",\"params\":[\"$pw\"],\"id\":1}" http://127.0.0.1:8112/json | jq -e '.result == true'
          docker exec goat sh -c 'ls /config/deluge/' | tr '\n' ' '
          echo "::notice::ruTorrent $(docker exec goat cat /opt/goat/versions/rutorrent) with rTorrent $(docker exec goat cat /opt/goat/versions/rtorrent), Deluge $(docker exec goat cat /opt/goat/versions/deluge)"
      - name: Stack page controls work inside the container
        run: |
          B=http://127.0.0.1:2806; J='Content-Type: application/json'
          curl -fsS -c /tmp/ck -H "$J" -d '{"name":"admin","password":"ci-password-123"}' $B/api/setup >/dev/null
          st=$(curl -fsS -b /tmp/ck $B/api/goat/status)
          echo "$st" | jq -e '.container and (.logins.jellyfin.user == "goat-admin") and (.engines | length >= 9)' >/dev/null
          # GoatMediaStackarr lists ruTorrent's and Deluge's torrents, and adds one to each.
          for t in rutorrent deluge; do
            id=$(curl -fsS -b /tmp/ck $B/api/services | jq -r ".[] | select(.type == \"$t\") | .id")
            [ -n "$id" ] || { echo "::error::$t is not among the apps"; exit 1; }
            curl -fsS -b /tmp/ck "$B/api/qb/$id/list" | jq -e '.torrents | type == "array"' >/dev/null || { echo "::error::$t list failed: $(curl -sS -b /tmp/ck "$B/api/qb/$id/list")"; exit 1; }
            curl -fsS -b /tmp/ck -H "$J" -H "Origin: $B" -d "{\"sid\":\"$id\",\"url\":\"magnet:?xt=urn:btih:dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c&dn=Big+Buck+Bunny\",\"paused\":true}" $B/api/torrent/add >/dev/null \
              || { echo "::error::$t add failed: $(curl -sS -b /tmp/ck -H "$J" -H "Origin: $B" -d "{\"sid\":\"$id\",\"url\":\"magnet:?xt=urn:btih:dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c\",\"paused\":true}" $B/api/torrent/add)"; exit 1; }
            sleep 3
            n=$(curl -fsS -b /tmp/ck "$B/api/qb/$id/list" | jq '.torrents | length')
            [ "$n" -ge 1 ] || { echo "::error::$t did not show the added torrent"; exit 1; }
            echo "::notice::$t: added a torrent through GoatMediaStackarr, now lists $n"
          done
          before=$(docker exec goat sh -c 'pgrep -f "bazarr.py" | head -1')
          curl -fsS -b /tmp/ck -H "$J" -H "Origin: $B" -d '{"engine":"bazarr"}' $B/api/goat/restart
          sleep 15
          after=$(docker exec goat sh -c 'pgrep -f "bazarr.py" | head -1')
          echo "Bazarr process before $before, after $after"
          [ -n "$after" ] && [ "$before" != "$after" ] || { echo "::error::Restart through the control service did not restart Bazarr"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck -H "$J" -H "Origin: $B" -d '{"engine":"nope"}' $B/api/goat/restart)
          [ "$code" = 500 ] || { echo "::error::Unknown app was not refused ($code)"; exit 1; }
          curl -fsS -b /tmp/ck -H "Origin: $B" -o /dev/null $B/engines/sonarr/
          echo "::notice::Stack page controls work: status, restart, refusal, engine page"
          # New passwords for the logins made for you: each app takes it, and Sonarr's download clients still work.
          for a in qbittorrent rutorrent deluge jellyfin; do
            t0=$(docker exec goat node -e 'console.log(Date.now())')
            r=$(curl -sS -b /tmp/ck -H "$J" -H "Origin: $B" -d "{\"app\":\"$a\",\"password\":\"Ci-new-$a-9\"}" $B/api/goat/login)
            echo "$r" | jq -e ".logins.$a.pass == \"Ci-new-$a-9\"" >/dev/null || { echo "::error::Changing the $a password failed: $(echo "$r" | jq -r '.error // .')"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck -H "$J" -H "Origin: $B" -d '{"app":"qbittorrent","password":"short"}' $B/api/goat/login)
          [ "$code" = 400 ] || { echo "::error::A too short password was not refused ($code)"; exit 1; }
          # qBittorrent lets every login through from inside the container, so check the password it stored instead.
          docker exec goat node -e 'const c=require("fs").readFileSync("/config/qbittorrent/qBittorrent/config/qBittorrent.conf","utf8"),m=c.match(/Password_PBKDF2="@ByteArray\(([^:]+):([^)]+)\)"/);process.exit(m&&require("crypto").pbkdf2Sync("Ci-new-qbittorrent-9",Buffer.from(m[1],"base64"),100000,64,"sha512").toString("base64")===m[2]?0:1)' \
            || { echo "::error::qBittorrent did not take its new password"; exit 1; }
          ok=""; for i in $(seq 1 30); do [ "$(docker exec goat curl -s -o /dev/null -w '%{http_code}' -u goat:Ci-new-rutorrent-9 http://127.0.0.1:8090/)" = 200 ] && { ok=1; break; }; sleep 2; done
          [ -n "$ok" ] || { echo "::error::ruTorrent did not take its new password"; exit 1; }
          # Every one of its web server's workers must have the new password, not just the first that answers.
          for i in $(seq 1 16); do c=$(docker exec goat curl -s -o /dev/null -w '%{http_code}' -u goat:Ci-new-rutorrent-9 -X POST -H 'Content-Type: text/xml' --data '<?xml version="1.0"?><methodCall><methodName>system.client_version</methodName></methodCall>' http://127.0.0.1:8090/RPC2)
            [ "$c" = 200 ] || { echo "::error::ruTorrent's RPC2 answered $c with the new password (try $i)"; docker exec goat ps -eo pid,etime,args | grep '[p]hp' || true; exit 1; }; done
          ok=""; for i in $(seq 1 30); do docker exec goat curl -fsS -H "$J" -d '{"method":"auth.login","params":["Ci-new-deluge-9"],"id":1}' http://127.0.0.1:8112/json 2>/dev/null | jq -e '.result == true' >/dev/null && { ok=1; break; }; sleep 2; done
          [ -n "$ok" ] || { echo "::error::Deluge did not take its new password"; exit 1; }
          docker exec goat curl -fsS -H "$J" -H 'Authorization: MediaBrowser Client="ci", Device="ci", DeviceId="ci", Version="1"' -d '{"Username":"goat-admin","Pw":"Ci-new-jellyfin-9"}' http://127.0.0.1:8096/Users/AuthenticateByName | jq -e '.AccessToken' >/dev/null || { echo "::error::Jellyfin did not take its new password"; exit 1; }
          # The wiring runs again and gives Sonarr the new passwords.
          # (wait for the run that started after the changes, not one that finished before them)
          # Each change starts the wiring again, so wait for the run that began with the last one.
          for i in $(seq 1 100); do docker exec goat jq -e --argjson t0 "$t0" '.running == false and .at >= $t0 and (.finished // 0) > .at' /config/goat/wired.json >/dev/null 2>&1 && break; sleep 3; done
          docker exec goat jq -c '{running, steps: (.steps | map_values(.ok))}' /config/goat/wired.json || true
          key=$(docker exec goat jq -r '.services[] | select(.key == "sonarr") | .apiKey' /config/goat/managed.json)
          t=""; for i in 1 2 3 4 5; do
            t=$(docker exec goat curl -sS -X POST -H "X-Api-Key: $key" -H "$J" -d '{}' http://127.0.0.1:8989/engines/sonarr/api/v3/downloadclient/testall || true)
            echo "$t" | jq -e 'type == "array" and length >= 3 and all(.isValid)' >/dev/null 2>&1 && break; sleep 10
          done
          echo "$t" | jq -c '[.[] | {id, isValid}]'
          echo "$t" | jq -e 'length >= 3 and all(.isValid)' >/dev/null || { echo "::error::Sonarr's download clients fail after the password change: $t"; exit 1; }
          echo "::notice::New passwords work in qBittorrent, ruTorrent, Deluge and Jellyfin, and in Sonarr's download clients"
      - name: Files belong to PUID/PGID
        run: |
          test "$(stat -c %u:%g /tmp/goat/config/sonarr/config.xml)" = "1001:121"
          test "$(stat -c %u:%g /tmp/goat/media/tv)" = "1001:121"
          test "$(stat -c %u:%g /tmp/goat/downloads/torrents/complete)" = "1001:121"
      - name: Restart keeps everything
        run: |
          docker restart goat
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:2806/api/health && break; sleep 5; done
          sleep 60
          docker exec goat jq -e '[.steps[] | .ok] | all' /config/goat/wired.json
      - name: Backups of the whole stack work for real
        run: |
          B=http://127.0.0.1:2806; J='Content-Type: application/json'
          curl -fsS -c /tmp/ck2 -H "$J" -d '{"name":"admin","password":"ci-password-123"}' $B/api/login >/dev/null
          job() { curl -fsS -b /tmp/ck2 $B/api/stack/backups | jq -c '.job'; }
          wait_job() { for i in $(seq 1 120); do j=$(job); echo "$j" | jq -e '.running == false' >/dev/null && { echo "$j"; return; }; sleep 3; done; echo "$j"; }
          curl -fsS -b /tmp/ck2 -H "$J" -H "Origin: $B" -d '{}' $B/api/stack/backups/run >/dev/null
          j=$(wait_job); echo "$j" | jq -c '{ok, error, result}'
          echo "$j" | jq -e '.ok == true' >/dev/null || { echo "::error::The backup failed: $(echo "$j" | jq -r .error)"; exit 1; }
          name=$(echo "$j" | jq -r .result.name)
          l=$(curl -fsS -b /tmp/ck2 $B/api/stack/backups)
          echo "$l" | jq -e --arg n "$name" '.files | map(.name) | index($n) != null' >/dev/null || { echo "::error::The backup is not listed"; exit 1; }
          curl -fsS -b /tmp/ck2 -o /tmp/sb.tar.gz "$B/api/stack/backups/$name"
          tar -tzf /tmp/sb.tar.gz > /tmp/sb.txt
          for f in ./sonarr/config.xml ./sonarr/sonarr.db ./radarr/radarr.db ./goat/secrets.json ./ui/db.json ./qbittorrent/qBittorrent/config/qBittorrent.conf; do
            grep -qxF "$f" /tmp/sb.txt || { echo "::error::$f is missing from the backup"; exit 1; }
          done
          grep -q '^./jellyfin/.*jellyfin\.db$' /tmp/sb.txt || { echo "::error::Jellyfin's database is missing from the backup"; grep '^./jellyfin/' /tmp/sb.txt | head -20; exit 1; }
          grep -q '^./sonarr/MediaCover/\|^./jellyfin/cache/\|^./jellyfin/data/metadata/' /tmp/sb.txt && { echo "::error::The backup carries artwork or caches"; exit 1; }
          # The database copy is a whole, working database.
          tar -xzf /tmp/sb.tar.gz -C /tmp ./sonarr/sonarr.db && docker run --rm --entrypoint sqlite3 -v /tmp/sonarr:/d goat:ci /d/sonarr.db 'pragma integrity_check;' | grep -qx ok \
            || { echo "::error::The copied Sonarr database is damaged"; exit 1; }
          # Putting Sonarr back: it is stopped, replaced, started, and answers again with the same key.
          key=$(docker exec goat jq -r '.services[] | select(.key == "sonarr") | .apiKey' /config/goat/managed.json)
          curl -fsS -b /tmp/ck2 -H "$J" -H "Origin: $B" -d "{\"name\":\"$name\",\"only\":[\"sonarr\"]}" $B/api/stack/backups/restore >/dev/null
          j=$(wait_job); echo "$j" | jq -c '{ok, error, result}'
          echo "$j" | jq -e '.ok == true and (.result.restored == ["sonarr"])' >/dev/null || { echo "::error::Putting Sonarr back failed: $(echo "$j" | jq -r .error)"; exit 1; }
          ok=""; for i in $(seq 1 60); do docker exec goat curl -fsS -H "X-Api-Key: $key" http://127.0.0.1:8989/engines/sonarr/api/v3/system/status >/dev/null 2>&1 && { ok=1; break; }; sleep 3; done
          [ -n "$ok" ] || { echo "::error::Sonarr did not come back after the restore"; exit 1; }
          echo "::notice::Stack backup $(echo "$l" | jq -r --arg n "$name" '.files[] | select(.name == $n) | .size' | numfmt --to=iec) with $(wc -l < /tmp/sb.txt) files; Sonarr put back and answering"
      - name: FlareSolverr works for real
        if: matrix.arch == 'amd64'
        run: |
          # Downloaded on first start with its own Chromium; it has to find the browser's version and open a page.
          mkdir -p /tmp/goatfs
          docker run -d --name goatfs -e PUID=1001 -e PGID=121 -e GOAT_ENGINES=prowlarr,flaresolverr -v /tmp/goatfs:/config goat:ci
          ok=""
          for i in $(seq 1 96); do
            if docker exec goatfs curl -fsS http://127.0.0.1:8191/health 2>/dev/null | grep -q ok; then ok=1; break; fi
            sleep 5
          done
          docker logs goatfs 2>&1 | grep -iE 'flaresolverr|chrom|browser' | tail -25
          [ -n "$ok" ] || { docker logs goatfs 2>&1 | grep -iE 'chrome|browser|librar|error' | tail -8 | sed 's/^/::error::/'; exit 1; }
          r=$(docker exec goatfs curl -sS -m 120 -H 'Content-Type: application/json' -d '{"cmd":"request.get","url":"https://example.com/","maxTimeout":60000}' http://127.0.0.1:8191/v1)
          echo "$r" | jq -c '{status, message, title: (.solution.response // "" | capture("<title>(?<t>[^<]*)").t?)}'
          echo "$r" | jq -e '.status == "ok"' >/dev/null || { echo "::error::FlareSolverr could not open a page: $(echo "$r" | jq -r .message)"; exit 1; }
          echo "::notice::FlareSolverr $(docker logs goatfs 2>&1 | grep -o "FlareSolverr's browser: .*" | tail -1)"
          docker rm -f goatfs >/dev/null; sudo rm -rf /tmp/goatfs
      - name: VPN on without a VPN file keeps the download apps offline
        run: |
          docker rm -f goat
          docker run -d --name goatvpn -e VPN_ENABLED=true -e PUID=1001 -e PGID=121 \
            -e MEDIA_DIR=/data/media -e DOWNLOADS_DIR=/data/downloads \
            -v /tmp/goat/config:/config -v /tmp/goat/shared:/data \
            --cap-add=NET_ADMIN --device=/dev/net/tun \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 --sysctl net.ipv4.conf.all.rp_filter=2 goat:ci
          sleep 45
          docker exec goatvpn cat /run/goat/vpn.json
          # One shared folder for both also works (MEDIA_DIR / DOWNLOADS_DIR inside /data).
          test -d /tmp/goat/shared/media/tv && test -d /tmp/goat/shared/downloads/torrents/complete
          docker exec goatvpn jq -e '.state == "waiting"' /run/goat/vpn.json
          # The VPN group has no internet; the other apps do. The check must fail with a network error
          # (curl 6, 7, 28 or 35), not because the command could not be run.
          set +e
          docker exec goatvpn /command/s6-applyuidgid -u 1001 -g 121 -G 121,9000 curl -sS --max-time 8 -o /dev/null https://1.1.1.1/cdn-cgi/trace
          rc=$?; set -e
          echo "VPN group curl exit code: $rc"
          case "$rc" in 6|7|28|35|56) echo "blocked, as it should be";; *) echo "::error::VPN app was not blocked (exit $rc)"; exit 1;; esac
          docker exec goatvpn /command/s6-applyuidgid -u 1001 -g 121 -G 121 curl -fsS --max-time 8 -o /dev/null https://1.1.1.1/cdn-cgi/trace
          docker exec goatvpn curl -fsS --max-time 5 http://127.0.0.1:8080/api/v2/app/version
      - name: Diagnostics
        if: failure()
        run: |
          # Each block becomes one annotation on the run page (newlines encoded as %0A), so problems can be read without the raw log.
          note() { printf '::error title=%s::%s\n' "$1" "$(cat | tail -n "${2:-80}" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          c=$(docker ps -aq --filter name=goat | head -1)
          [ -n "$c" ] || exit 0
          docker exec "$c" ps -eo pid,user,etime,args --sort=etime 2>&1 | grep -v ' ps ' | note "Running programs" 60
          docker logs "$c" 2>&1 | grep -iE 'jellyfin|seerr|goat|fatal|exception|crit' | note "Container log (filtered)" 80
          docker exec "$c" sh -c 'ls -t /config/jellyfin/log/*.log 2>/dev/null | head -1 | xargs -r tail -n 120' | grep -iE 'ERR|FTL|exception|fatal|warn|Kestrel|listening|started' | note "Jellyfin log" 60
          docker exec "$c" sh -c 'tail -n 40 /config/seerr/logs/seerr-*.log 2>/dev/null' | note "Seerr log" 40
          docker logs "$c" 2>&1 | grep -iE 'rtorrent|rutorrent|deluge|php' | note "ruTorrent and Deluge log" 60
          docker exec "$c" sh -c 'tail -n 30 /config/rutorrent/errors.log 2>/dev/null' | note "ruTorrent errors.log" 30
          docker exec "$c" sh -c 'curl -sS -m 5 http://127.0.0.1:8096/System/Info/Public; echo; curl -sS -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:8096/health' 2>&1 | note "Jellyfin answers" 10
