name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:   # the weekly rebuild runs these same checks before publishing
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools shellcheck
      - run: npm run check
      - run: npm test
      - name: Shell scripts
        run: shellcheck -S error -s bash goat/*.sh test/*.sh
      - name: VPN kill switch (real network namespaces)
        run: sudo bash test/vpn-killswitch.sh

  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The image is ~2.8 GB and Jellyfin will not start with less than 2 GB free, so remove the runner's
        # preinstalled SDKs first.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1 | awk '{print "::notice::Free disk space before building: " $4}'
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! docker buildx build --load --progress=plain -t goat:ci --build-arg VERSION=ci \
                 --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN . 2>&1 | tee build.log; then
            # Turn the important lines into annotations so the reason shows on the run's page.
            grep -E 'fetch-release|ERROR|E: |error:|Error:|No matching|not found' build.log | tail -10 | sed 's/^/::error::/'
            exit 1
          fi
          grep -E '^#[0-9]+ [0-9.]+ fetch-release: [A-Za-z0-9_-]+/[A-Za-z0-9_-]+ ' build.log | sed 's/^/::notice::/' || true
          docker buildx prune -af >/dev/null 2>&1 || true
          df -h / | tail -1 | awk '{print "::notice::Free disk space after building: " $4}'
      - name: Image size
        run: echo "::notice::Image size (${{ matrix.arch }}) $(docker image inspect goat:ci --format '{{.Size}}' | numfmt --to=iec)"
      - name: Start it
        run: |
          mkdir -p /tmp/goat/config /tmp/goat/media /tmp/goat/downloads
          docker run -d --name goat -p 2806:2806 -p 8096:8096 \
            -e PUID=1001 -e PGID=121 -e TZ=Asia/Kolkata \
            -e GOAT_ENGINES=sonarr,radarr,lidarr,prowlarr,bazarr,qbittorrent,sabnzbd,jellyfin,seerr,tautulli \
            -v /tmp/goat/config:/config -v /tmp/goat/media:/media -v /tmp/goat/downloads:/downloads \
            --cap-add=NET_ADMIN --device=/dev/net/tun \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 --sysctl net.ipv4.conf.all.rp_filter=2 \
            goat:ci
      - name: Every engine answers
        run: |
          check() { docker exec goat curl -fsS -o /dev/null --max-time 5 "$2"; }
          declare -A urls=(
            [sonarr]=http://127.0.0.1:8989/engines/sonarr/ping
            [radarr]=http://127.0.0.1:7878/engines/radarr/ping
            [lidarr]=http://127.0.0.1:8686/engines/lidarr/ping
            [prowlarr]=http://127.0.0.1:9696/engines/prowlarr/ping
            [bazarr]=http://127.0.0.1:6767/engines/bazarr/
            [qbittorrent]=http://127.0.0.1:8080/api/v2/app/version
            [sabnzbd]=http://127.0.0.1:8085/engines/sabnzbd/
            [jellyfin]=http://127.0.0.1:8096/health
            [seerr]=http://127.0.0.1:5055/api/v1/status
            [tautulli]=http://127.0.0.1:8181/engines/tautulli/
            [ui]=http://127.0.0.1:2806/api/health )
          for i in $(seq 1 90); do
            missing=""
            for k in "${!urls[@]}"; do check "$k" "${urls[$k]}" || missing="$missing $k"; done
            [ -z "$missing" ] && { echo "All engines answer."; exit 0; }
            echo "waiting for:$missing"; sleep 10
          done
          docker logs goat 2>&1 | tail -60 | sed 's/^/::error::/'; exit 1
      - name: Engines are connected to each other
        run: |
          for i in $(seq 1 60); do
            if docker exec goat test -f /config/goat/wired.json; then
              docker exec goat cat /config/goat/wired.json | jq -c '.steps | to_entries[] | {(.key): .value.ok}'
              if docker exec goat jq -e '[.steps[] | .ok] | length >= 6 and all' /config/goat/wired.json >/dev/null; then exit 0; fi
            fi
            sleep 10
          done
          docker exec goat jq -r '.steps | to_entries[] | select(.value.ok | not) | "::error::\(.key): \(.value.error)"' /config/goat/wired.json || true
          docker logs goat 2>&1 | grep -E 'goat-wire.*FAILED' | tail -5 | cut -c1-900 | sed 's/^/::error::/'
          exit 1
      - name: Stack page controls work inside the container
        run: |
          B=http://127.0.0.1:2806; J='Content-Type: application/json'
          curl -fsS -c /tmp/ck -H "$J" -d '{"name":"admin","password":"ci-password-123"}' $B/api/setup >/dev/null
          st=$(curl -fsS -b /tmp/ck $B/api/goat/status)
          echo "$st" | jq -e '.container and (.logins.jellyfin.user == "goat-admin") and (.engines | length >= 9)' >/dev/null
          before=$(docker exec goat sh -c 'pgrep -f "bazarr.py" | head -1')
          curl -fsS -b /tmp/ck -H "$J" -H "Origin: $B" -d '{"engine":"bazarr"}' $B/api/goat/restart
          sleep 15
          after=$(docker exec goat sh -c 'pgrep -f "bazarr.py" | head -1')
          echo "Bazarr process before $before, after $after"
          [ -n "$after" ] && [ "$before" != "$after" ] || { echo "::error::Restart through the control service did not restart Bazarr"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck -H "$J" -H "Origin: $B" -d '{"engine":"nope"}' $B/api/goat/restart)
          [ "$code" = 500 ] || { echo "::error::Unknown app was not refused ($code)"; exit 1; }
          curl -fsS -b /tmp/ck -H "Origin: $B" -o /dev/null $B/engines/sonarr/
          echo "::notice::Stack page controls work: status, restart, refusal, engine page"
      - name: Files belong to PUID/PGID
        run: |
          test "$(stat -c %u:%g /tmp/goat/config/sonarr/config.xml)" = "1001:121"
          test "$(stat -c %u:%g /tmp/goat/media/tv)" = "1001:121"
          test "$(stat -c %u:%g /tmp/goat/downloads/torrents/complete)" = "1001:121"
      - name: Restart keeps everything
        run: |
          docker restart goat
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:2806/api/health && break; sleep 5; done
          sleep 60
          docker exec goat jq -e '[.steps[] | .ok] | all' /config/goat/wired.json
      - name: VPN on without a VPN file keeps the download apps offline
        run: |
          docker rm -f goat
          docker run -d --name goatvpn -e VPN_ENABLED=true -e PUID=1001 -e PGID=121 \
            -e MEDIA_DIR=/data/media -e DOWNLOADS_DIR=/data/downloads \
            -v /tmp/goat/config:/config -v /tmp/goat/shared:/data \
            --cap-add=NET_ADMIN --device=/dev/net/tun \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 --sysctl net.ipv4.conf.all.rp_filter=2 goat:ci
          sleep 45
          docker exec goatvpn cat /run/goat/vpn.json
          # One shared folder for both also works (MEDIA_DIR / DOWNLOADS_DIR inside /data).
          test -d /tmp/goat/shared/media/tv && test -d /tmp/goat/shared/downloads/torrents/complete
          docker exec goatvpn jq -e '.state == "waiting"' /run/goat/vpn.json
          # The VPN group has no internet; the other apps do. The check must fail with a network error
          # (curl 6, 7, 28 or 35), not because the command could not be run.
          set +e
          docker exec goatvpn /command/s6-applyuidgid -u 1001 -g 121 -G 121,9000 curl -sS --max-time 8 -o /dev/null https://1.1.1.1/cdn-cgi/trace
          rc=$?; set -e
          echo "VPN group curl exit code: $rc"
          case "$rc" in 6|7|28|35|56) echo "blocked, as it should be";; *) echo "::error::VPN app was not blocked (exit $rc)"; exit 1;; esac
          docker exec goatvpn /command/s6-applyuidgid -u 1001 -g 121 -G 121 curl -fsS --max-time 8 -o /dev/null https://1.1.1.1/cdn-cgi/trace
          docker exec goatvpn curl -fsS --max-time 5 http://127.0.0.1:8080/api/v2/app/version
      - name: Diagnostics
        if: failure()
        run: |
          # Each block becomes one annotation on the run page (newlines encoded as %0A), so problems can be read without the raw log.
          note() { printf '::error title=%s::%s\n' "$1" "$(cat | tail -n "${2:-80}" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          c=$(docker ps -aq --filter name=goat | head -1)
          [ -n "$c" ] || exit 0
          docker exec "$c" ps -eo pid,user,etime,args --sort=etime 2>&1 | grep -v ' ps ' | note "Running programs" 60
          docker logs "$c" 2>&1 | grep -iE 'jellyfin|seerr|goat|fatal|exception|crit' | note "Container log (filtered)" 80
          docker exec "$c" sh -c 'ls -t /config/jellyfin/log/*.log 2>/dev/null | head -1 | xargs -r tail -n 120' | grep -iE 'ERR|FTL|exception|fatal|warn|Kestrel|listening|started' | note "Jellyfin log" 60
          docker exec "$c" sh -c 'tail -n 40 /config/seerr/logs/seerr-*.log 2>/dev/null' | note "Seerr log" 40
          docker exec "$c" sh -c 'curl -sS -m 5 http://127.0.0.1:8096/System/Info/Public; echo; curl -sS -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:8096/health' 2>&1 | note "Jellyfin answers" 10
