name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner already has the Android SDK; this only makes sure the parts the app needs are there.
      - name: Get the Android parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "::notice::App version $v (build $GITHUB_RUN_NUMBER)"
      - name: Test and build
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain -PappVersion="${{ steps.v.outputs.name }}" -PappCode="$GITHUB_RUN_NUMBER" recordRoborazziDebug assembleRelease 2>&1 | tee /tmp/build.log; then
            set +e
            # Kotlin errors look like "e: file:///…/Foo.kt:12:5 Message": show each one on its file and line.
            grep -E '^e: ' /tmp/build.log | head -80 | while IFS= read -r line; do
              f=$(echo "$line" | sed -E 's#^e: (file://)?([^ ]+\.kt):([0-9]+):([0-9]+) .*#\2#' | sed "s#^$GITHUB_WORKSPACE/##")
              l=$(echo "$line" | sed -E 's#^e: (file://)?[^ ]+\.kt:([0-9]+):([0-9]+) .*#\2#')
              msg=$(echo "$line" | sed -E 's#^e: (file://)?[^ ]+\.kt:[0-9]+:[0-9]+ ##')
              echo "::error file=$f,line=$l::$msg"
            done
            # The end of the log, for anything else (dependencies, resources, tests).
            tail -n 70 /tmp/build.log | grep -v '^\s*at ' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=End of the build log::/'; echo
            exit 1
          fi
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk goatmediastackarr.apk && ls -la goatmediastackarr.apk | awk '{print "::notice::APK size " $5 " bytes"}'
      - uses: actions/upload-artifact@v4
        with:
          name: goatmediastackarr-apk
          path: goatmediastackarr.apk
      # Photos of every screen, taken against a pretend server, kept on the android-shots branch for review.
      - name: Keep the screen photos
        if: github.ref == 'refs/heads/main'
        run: |
          n=$(ls android/app/build/outputs/roborazzi/*.png 2>/dev/null | wc -l); echo "::notice::$n screen photos"
          [ "$n" -gt 0 ] || exit 0
          d=$(mktemp -d); cp android/app/build/outputs/roborazzi/*.png "$d"/; cd "$d"
          git init -q && git checkout -q -b android-shots && git add . \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screens from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-shots
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: goatmediastackarr.apk
